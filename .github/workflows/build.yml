name: Build and Release

on:
  push:
    branches:
      - master
      - github-actions
    tags:
      - "v*"
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.x"

      - name: Install SteamCMD
        shell: pwsh
        run: choco install steamcmd -y --no-progress

      - name: Download current Valheim Dedicated Server assemblies
        shell: pwsh
        run: |
          $steamcmd = (Get-Command steamcmd.exe).Source
          & $steamcmd +force_install_dir "$env:GITHUB_WORKSPACE\valheim-server" +login anonymous +app_update 896660 validate +quit
          $assembly = Get-ChildItem -Path "$env:GITHUB_WORKSPACE\valheim-server" -Filter "assembly_valheim.dll" -Recurse -File | Select-Object -First 1
          if ($null -eq $assembly) {
            Write-Host "Downloaded Valheim directory tree:"
            Get-ChildItem -Path "$env:GITHUB_WORKSPACE\valheim-server" -Recurse | Select-Object -ExpandProperty FullName
            throw "assembly_valheim.dll was not found anywhere in the downloaded Valheim Dedicated Server."
          }
          $managed = $assembly.DirectoryName
          Write-Host "Using Valheim managed assemblies from: $managed"
          "VALHEIM_MANAGED=$managed" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Restore
        run: dotnet restore AzimuthStonecutterBronze.csproj

      - name: Build
        run: dotnet build AzimuthStonecutterBronze.csproj --configuration Release --no-restore

      - name: Stage package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package/plugins | Out-Null
          Copy-Item bin/Release/net462/AzimuthStonecutterBronze.dll package/plugins/
          Copy-Item README.md package/
          if (Test-Path LICENSE.txt) { Copy-Item LICENSE.txt package/ }
          if (Test-Path LICENSE) { Copy-Item LICENSE package/ }
          @'
          {
            "name": "AzimuthStonecutterBronze",
            "version_number": "1.0.0",
            "website_url": "https://github.com/jrhunt223/AzimuthStonecutterBronze",
            "description": "Changes the Valheim Stonecutter cost from 2 Iron to 2 Bronze while preserving Iron progression for the Sharpening Stone.",
            "dependencies": [
              "denikson-BepInExPack_Valheim-5.4.2333",
              "ValheimModding-Jotunn-2.30.1"
            ]
          }
          '@ | Set-Content package/manifest.json
          Compress-Archive -Path package/* -DestinationPath AzimuthStonecutterBronze.zip -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AzimuthStonecutterBronze
          path: AzimuthStonecutterBronze.zip

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: AzimuthStonecutterBronze.zip
          generate_release_notes: true
